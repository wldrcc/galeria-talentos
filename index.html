<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anuario Colaborativo 2026</title>
    <link rel="stylesheet" href="style-main.css">
</head>
<body>
    <header>
        <h1>Galería de Talentos</h1>
        <p>Conoce a las personas, ideas y proyectos de nuestra comunidad.</p>
    </header>

    <main id="container-anuario" class="grid-container" aria-label="Perfiles de estudiantes">
    </main>

    <script>
        // CADA ALUMNO AGREGA SU OBJETO A ESTA LISTA
        const alumnos = [
            { nombre: "Ana García", imagen: "image/img1.jpg", archivo: "perfil-ana.html" },
            { nombre: "Juan Pérez", imagen: "https://i.pravatar.cc/150?u=juan", archivo: "perfil-juan.html" },
            { nombre: "Lucía Torres", imagen: "https://i.pravatar.cc/150?u=lucia", archivo: "perfil-lucia.html" },
            { nombre: "Anthony Wilfredo", imagen: "image/perfil-anthony.png", archivo: "perfil-anthony.html" },
            { nombre: "Rossental Solis", imagen: "../image/solis/foto.jpeg", archivo: "perfil-solis.html" },
            { nombre: "Rhiguel Sanchez", imagen: "image/img3.jpeg", archivo: "perfil-rhiguel.html" },
            { nombre: "Daniel Huacho", imagen: "image/huacho.jpeg", archivo: "perfil-huacho.html" },
            { nombre: "Itzel Bartolo", imagen: "image/chango.jpeg", archivo: "perfil.tzl/perfil-itzel.html"},       
            { nombre: "estefany vilchez", imagen: "image/tefaimageimg1.jpg", archivo: "perfil-estefany.html" }
        ];

        const container = document.getElementById('container-anuario');

        alumnos.forEach(alumno => {
            container.innerHTML += `
                <a class="card ${alumno.archivo === 'perfil-huacho.html' ? 'card-huacho' : ''}" href="proyectos/${alumno.archivo}">
                    <img src="${alumno.imagen}" alt="${alumno.nombre}">
                    <h3>${alumno.nombre}</h3>
                    <span>Ver Perfil →</span>
                </a>
            `;
        });
    </script>
</body>
</html>
